<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--grid:#dcd8cb;--ink:#14213d;--card:#fffdf8;--mute:#5b6678;--mark:#ffcf33;--pop:#ff5d73;--teal:#2ec4b6;--blue:#4361ee}
@media (prefers-color-scheme:dark){:root{--bg:#10172a;--grid:#1b2542;--ink:#f1efe8;--card:#18213a;--mute:#9aa6bd}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:28px 20px 64px}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px;font-weight:600}
.logo{font-weight:800;font-size:1.2rem}
.logo i{font-style:normal;display:inline-block;background:var(--pop);color:#fff;border-radius:50%;width:30px;height:30px;text-align:center;line-height:30px;margin-right:8px;font-size:1rem}
nav a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--mark)}
h1{font-size:clamp(3rem,11vw,6.8rem);line-height:.92;margin:0 0 20px;font-weight:800;letter-spacing:-.04em}
h1 span{background:var(--mark);color:#14213d;padding:0 .12em;display:inline-block;transform:rotate(-2deg)}
.lead{max-width:46ch;color:var(--mute);font-size:1.2rem;margin:0 0 20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:56px}
.stat{border:2px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:600;background:var(--card)}
h2.sec{font-size:1.6rem;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.card:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;border-bottom:2px solid var(--ink)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:1.4rem}
.card p{margin:0;color:var(--mute);flex:1}
.tag{align-self:flex-start;font-size:.8rem;font-weight:600;background:var(--mark);color:#14213d;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
.play{font-weight:800;margin-top:6px}
.card.empty{border-style:dashed;box-shadow:none;cursor:default;background:transparent}
.card.empty:hover{transform:none;box-shadow:none}
.card.empty .thumb{border-bottom-style:dashed;color:var(--mute)}
dialog{border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:min(680px,94vw);max-height:92vh;padding:20px;box-shadow:8px 8px 0 var(--ink);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
dialog::backdrop{background:rgba(10,15,30,.65)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.bar h3{margin:0;font-size:1.6rem}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px}
canvas{max-width:100%;border:2px solid var(--ink);border-radius:8px;background:var(--bg);touch-action:none}
.big{font-size:3rem;font-weight:800;margin:0}
.crit{font-size:5rem;background:none;border:0;cursor:pointer;transition:transform .08s}
.crit:active{transform:scale(.85)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,360px)}
.tile{aspect-ratio:1;font-size:2.2rem;border:2px solid var(--ink);border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
.tile.up{background:var(--card)}
.tile.done{background:var(--teal);cursor:default}
.info{margin:0;color:var(--mute);font-weight:600}
footer{margin-top:64px;color:var(--mute);border-top:2px solid var(--ink);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>

  <h1>My Stuff</h1>
  

  <h2 class="sec" id="projects">Projects</h2>
  <div class="grid" id="grid"></div>

  <footer>Made by <strong>Your Name</strong>. Built with HTML, CSS, and JavaScript.</footer>
</main>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="bar"><h3 id="dtitle"></h3><button class="btn" id="close">Close</button></div>
  <div id="stage" class="stage"></div>
</dialog>

<script>
/* ===== ADD NEW PROJECTS HERE =====
   Each project needs: title, tag, icon, color, blurb, and mount(el).
   mount builds the project inside el. Return a function to stop timers/animation. */
const projects = [
{
  title:"Memory Match", tag:"Game", icon:"🃏", color:"#bde0fe", blurb:"Flip cards and find all 8 pairs in as few moves as you can.",
  mount(el){
    const emojis=['🐙','🦊','🍕','🚀','🎸','🌵','🐢','🍩'];
    let first=null,lock=false,moves=0,found=0,best=null;
    try{best=localStorage.getItem('memory-best')}catch(e){}
    el.innerHTML=`<p class="info" id="info"></p><div class="mem" id="mem"></div><button class="btn" id="re">New game</button>`;
    const info=el.querySelector('#info'),mem=el.querySelector('#mem');
    function show(){info.textContent=`Moves: ${moves}`+(best?`   Best: ${best}`:'')}
    function start(){
      moves=0;found=0;first=null;lock=false;mem.innerHTML='';
      const deck=[...emojis,...emojis].sort(()=>Math.random()-.5);
      deck.forEach(e=>{
        const t=document.createElement('button');t.className='tile';t.setAttribute('aria-label','Hidden card');t.textContent='?';
        t.onclick=()=>flip(t,e);mem.appendChild(t);
      });
      show();
    }
    function flip(t,e){
      if(lock||t.classList.contains('up')||t.classList.contains('done'))return;
      t.classList.add('up');t.textContent=e;
      if(!first){first={t,e};return}
      moves++;show();
      if(first.e===e){
        first.t.classList.replace('up','done');t.classList.replace('up','done');first=null;found++;
        if(found===8){
          info.textContent=`You won in ${moves} moves!`;
          if(!best||moves<best){best=moves;try{localStorage.setItem('memory-best',moves)}catch(x){}}
        }
      }else{
        lock=true;const a=first.t;first=null;
        setTimeout(()=>{a.classList.remove('up');a.textContent='?';t.classList.remove('up');t.textContent='?';lock=false},700);
      }
    }
    el.querySelector('#re').onclick=start;start();
  }
},
{
  title:"Bounce Box", tag:"Toy", icon:"🏀", color:"#caffbf", blurb:"Tap anywhere to drop a bouncing ball. See how many fit.",
  mount(el){
    el.innerHTML=`<canvas width="600" height="360" id="cv"></canvas><button class="btn" id="clr">Clear</button>`;
    const cv=el.querySelector('#cv'),g=cv.getContext('2d');let balls=[],raf;
    const cols=['#ff5d73','#ffcf33','#2ec4b6','#4361ee'];
    cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),s=cv.width/r.width;
      balls.push({x:(e.clientX-r.left)*s,y:(e.clientY-r.top)*s,vx:(Math.random()-.5)*8,vy:0,r:10+Math.random()*14,c:cols[balls.length%4]})});
    el.querySelector('#clr').onclick=()=>balls=[];
    (function loop(){g.clearRect(0,0,cv.width,cv.height);
      for(const b of balls){b.vy+=.4;b.x+=b.vx;b.y+=b.vy;
        if(b.y+b.r>cv.height){b.y=cv.height-b.r;b.vy*=-.8}
        if(b.x<b.r||b.x>cv.width-b.r){b.vx*=-1;b.x=Math.max(b.r,Math.min(cv.width-b.r,b.x))}
        g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}
      raf=requestAnimationFrame(loop)})();
    return ()=>cancelAnimationFrame(raf);
  }
}
];

const grid=document.getElementById('grid'),dlg=document.getElementById('dlg'),stage=document.getElementById('stage');
let cleanup=null;
document.getElementById('count').textContent=`${projects.length} projects`;
projects.forEach(p=>{
  const b=document.createElement('button');b.className='card';
  b.innerHTML=`<div class="thumb" style="background:${p.color}">${p.icon}</div>
  <div class="body"><span class="tag">${p.tag}</span><h3>${p.title}</h3><p>${p.blurb}</p><span class="play">Play now</span></div>`;
  b.onclick=()=>{document.getElementById('dtitle').textContent=p.title;stage.innerHTML='';cleanup=p.mount(stage);dlg.showModal()};
  grid.appendChild(b);
});
const e=document.createElement('div');e.className='card empty';
e.innerHTML=`<div class="thumb">+</div><div class="body"><h3>Next project</h3><p>Coming soon.</p></div>`;grid.appendChild(e);
function shut(){if(cleanup)cleanup();cleanup=null;stage.innerHTML=''}
document.getElementById('close').onclick=()=>dlg.close();
dlg.addEventListener('close',shut);
dlg.addEventListener('click',ev=>{if(ev.target===dlg)dlg.close()});
</script>
</body>
</html>
